name: Multi-Environment Deployment

on:
  # push:
  #   branches:
  #     - main
  #     - develop
  #     - dev
  #     - UI-UPDATES-ALLYIA
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-west-2'

jobs:
  # Run comprehensive frontend tests first
  test:
    name: Run Frontend Tests
    uses: ./.github/workflows/frontend-test.yml

  determine-environment:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    needs: test
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      should-deploy: ${{ steps.env.outputs.should-deploy }}

    steps:
      - name: Determine environment
        id: env
        run: |
          # Don't deploy on pull requests
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "Pull request - tests only, no deployment"
            exit 0
          fi

          # Determine environment based on branch or manual input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]] || [[ "${{ github.ref }}" == "refs/heads/dev" ]] || [[ "${{ github.ref }}" == "refs/heads/UI-UPDATES-ALLYIA" ]]; then
            ENVIRONMENT="dev"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENVIRONMENT="staging"
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "Unknown branch - no deployment"
            exit 0
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "should-deploy=true" >> $GITHUB_OUTPUT
          echo "Target environment: $ENVIRONMENT"

  build:
    name: Build for ${{ needs.determine-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.should-deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Create environment configuration
        run: |
          ENVIRONMENT=${{ needs.determine-environment.outputs.environment }}
          echo "Creating environment configuration for: $ENVIRONMENT"

          # Set environment-specific URLs
          if [ "$ENVIRONMENT" = "dev" ]; then
            API_URL="https://api.allyvia.co/api/v1"
            FRONTEND_URL="https://app.allyvia.co"
          elif [ "$ENVIRONMENT" = "staging" ]; then
            API_URL="https://api-staging.allyvia.co/api/v1"
            FRONTEND_URL="https://staging.allyvia.co"
          elif [ "$ENVIRONMENT" = "prod" ]; then
            API_URL="https://api.allyvia.co/api/v1"
            FRONTEND_URL="https://app.allyvia.co"
          else
            echo "Invalid environment: $ENVIRONMENT"
            exit 1
          fi

          cat > .env.production << EOF
          VITE_APP_VERSION=v1.0.0
          GENERATE_SOURCEMAP=false

          # Backend API URL
          VITE_APP_API_URL=$API_URL
          VITE_APP_BASE_NAME=/

          # QuickBooks Integration
          VITE_APP_QB_CALLBACK_URL=$FRONTEND_URL/quickbooks-callback

          # Environment
          VITE_APP_ENVIRONMENT=$ENVIRONMENT

          # Production optimizations
          VITE_USE_MOCK_API=false
          EOF

          echo "Environment configuration created:"
          cat .env.production

      - name: Build application
        run: |
          echo "Building for ${{ needs.determine-environment.outputs.environment }} environment..."
          NODE_ENV=production yarn build

          # Verify build output
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: index.html not found in dist"
            exit 1
          fi

          # Verify no localhost references
          if grep -r "localhost:8000" dist/ 2>/dev/null; then
            echo "Warning: Found localhost references in build"
          fi

          echo "Build successful for ${{ needs.determine-environment.outputs.environment }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ needs.determine-environment.outputs.environment }}
          path: dist/
          retention-days: 7

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [determine-environment, build]
    if: |
      needs.determine-environment.outputs.should-deploy == 'true' &&
      needs.determine-environment.outputs.environment == 'dev'
    environment: development
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dev
          path: ./dist

      - name: Verify build artifacts
        run: |
          echo "Build artifacts downloaded:"
          ls -la ./dist/

          if [ ! -f "./dist/index.html" ]; then
            echo "Missing index.html in build artifacts"
            exit 1
          fi

      - name: Deploy to S3
        run: |
          echo "Deploying to S3 bucket: allyvia-dev-frontend"
          aws s3 rm s3://allyvia-dev-frontend --recursive

          # Create upload script with correct MIME types
          cat > upload_with_mime.sh << 'EOF'
          #!/bin/bash
          for file in $(find ./dist -type f); do
            key=${file#./dist/}
            if [[ "$file" == *.html ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "text/html"
            elif [[ "$file" == *.js ]] || [[ "$file" == *.mjs ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "application/javascript"
            elif [[ "$file" == *.css ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "text/css"
            elif [[ "$file" == *.json ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "application/json"
            elif [[ "$file" == *.svg ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/svg+xml"
            elif [[ "$file" == *.png ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/png"
            elif [[ "$file" == *.jpg ]] || [[ "$file" == *.jpeg ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/jpeg"
            elif [[ "$file" == *.ico ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/x-icon"
            elif [[ "$file" == *.woff ]] || [[ "$file" == *.woff2 ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "font/woff"
            elif [[ "$file" == *.ttf ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "font/ttf"
            else
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key"
            fi
          done
          EOF

          chmod +x upload_with_mime.sh
          ./upload_with_mime.sh

          # Set cache headers
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend --recursive --exclude "*" --include "*.js" --include "*.mjs" --metadata-directive REPLACE --content-type "application/javascript" --cache-control "max-age=31536000,public,immutable"
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend --recursive --exclude "*" --include "*.css" --metadata-directive REPLACE --content-type "text/css" --cache-control "max-age=31536000,public,immutable"
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend --recursive --exclude "*" --include "*.woff*" --include "*.ttf" --include "*.png" --include "*.jpg" --include "*.jpeg" --include "*.gif" --include "*.svg" --include "*.ico" --metadata-directive REPLACE --cache-control "max-age=31536000,public,immutable"
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend --recursive --exclude "*" --include "*.html" --metadata-directive REPLACE --content-type "text/html" --cache-control "max-age=0,no-cache,no-store,must-revalidate"

          echo "S3 deployment completed"

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront cache..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id E2SUBFVBSB9DJG --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Invalidation created: $INVALIDATION_ID"

      - name: Deployment summary
        run: |
          echo "## Development Frontend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: https://app.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [determine-environment, build]
    if: |
      needs.determine-environment.outputs.should-deploy == 'true' &&
      needs.determine-environment.outputs.environment == 'staging'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-staging
          path: ./dist

      - name: Verify build artifacts
        run: |
          echo "Build artifacts downloaded:"
          ls -la ./dist/
          if [ ! -f "./dist/index.html" ]; then
            echo "Missing index.html in build artifacts"
            exit 1
          fi

      - name: Deploy to S3
        run: |
          echo "Deploying to S3 bucket: allyvia-staging-frontend"
          aws s3 rm s3://allyvia-staging-frontend --recursive

          # Create upload script with correct MIME types
          cat > upload_with_mime.sh << 'EOF'
          #!/bin/bash
          for file in $(find ./dist -type f); do
            key=${file#./dist/}
            if [[ "$file" == *.html ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "text/html"
            elif [[ "$file" == *.js ]] || [[ "$file" == *.mjs ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "application/javascript"
            elif [[ "$file" == *.css ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "text/css"
            elif [[ "$file" == *.json ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "application/json"
            elif [[ "$file" == *.svg ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "image/svg+xml"
            elif [[ "$file" == *.png ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "image/png"
            elif [[ "$file" == *.jpg ]] || [[ "$file" == *.jpeg ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "image/jpeg"
            elif [[ "$file" == *.ico ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "image/x-icon"
            elif [[ "$file" == *.woff ]] || [[ "$file" == *.woff2 ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "font/woff"
            elif [[ "$file" == *.ttf ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "font/ttf"
            else
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key"
            fi
          done
          EOF

          chmod +x upload_with_mime.sh
          ./upload_with_mime.sh

          # Set cache headers
          aws s3 cp s3://allyvia-staging-frontend s3://allyvia-staging-frontend --recursive --exclude "*" --include "*.js" --include "*.mjs" --metadata-directive REPLACE --content-type "application/javascript" --cache-control "max-age=31536000,public,immutable"
          aws s3 cp s3://allyvia-staging-frontend s3://allyvia-staging-frontend --recursive --exclude "*" --include "*.css" --metadata-directive REPLACE --content-type "text/css" --cache-control "max-age=31536000,public,immutable"
          aws s3 cp s3://allyvia-staging-frontend s3://allyvia-staging-frontend --recursive --exclude "*" --include "*.woff*" --include "*.ttf" --include "*.png" --include "*.jpg" --include "*.jpeg" --include "*.gif" --include "*.svg" --include "*.ico" --metadata-directive REPLACE --cache-control "max-age=31536000,public,immutable"
          aws s3 cp s3://allyvia-staging-frontend s3://allyvia-staging-frontend --recursive --exclude "*" --include "*.html" --metadata-directive REPLACE --content-type "text/html" --cache-control "max-age=0,no-cache,no-store,must-revalidate"

          echo "S3 deployment completed"

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront cache..."
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query 'DistributionList.Items[?contains(Aliases.Items, `staging.allyvia.co`)].Id' --output text)
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "CloudFront distribution not found, skipping invalidation"
            exit 0
          fi
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Invalidation created: $INVALIDATION_ID"

      - name: Deployment summary
        run: |
          echo "## Staging Frontend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: https://staging.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [determine-environment, build]
    if: |
      needs.determine-environment.outputs.should-deploy == 'true' &&
      needs.determine-environment.outputs.environment == 'prod'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-prod
          path: ./dist

      - name: Verify build artifacts
        run: |
          echo "Build artifacts downloaded:"
          ls -la ./dist/
          if [ ! -f "./dist/index.html" ]; then
            echo "Missing index.html in build artifacts"
            exit 1
          fi

      - name: Deploy to S3
        run: |
          echo "Deploying to S3 bucket: allyvia-prod-frontend"
          aws s3 rm s3://allyvia-prod-frontend --recursive

          # Create upload script with correct MIME types
          cat > upload_with_mime.sh << 'EOF'
          #!/bin/bash
          for file in $(find ./dist -type f); do
            key=${file#./dist/}
            if [[ "$file" == *.html ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "text/html"
            elif [[ "$file" == *.js ]] || [[ "$file" == *.mjs ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "application/javascript"
            elif [[ "$file" == *.css ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "text/css"
            elif [[ "$file" == *.json ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "application/json"
            elif [[ "$file" == *.svg ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "image/svg+xml"
            elif [[ "$file" == *.png ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "image/png"
            elif [[ "$file" == *.jpg ]] || [[ "$file" == *.jpeg ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "image/jpeg"
            elif [[ "$file" == *.ico ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "image/x-icon"
            elif [[ "$file" == *.woff ]] || [[ "$file" == *.woff2 ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "font/woff"
            elif [[ "$file" == *.ttf ]]; then
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key" --content-type "font/ttf"
            else
              aws s3 cp "$file" "s3://allyvia-prod-frontend/$key"
            fi
          done
          EOF

          chmod +x upload_with_mime.sh
          ./upload_with_mime.sh

          # Set cache headers
          aws s3 cp s3://allyvia-prod-frontend s3://allyvia-prod-frontend --recursive --exclude "*" --include "*.js" --include "*.mjs" --metadata-directive REPLACE --content-type "application/javascript" --cache-control "max-age=31536000,public,immutable"
          aws s3 cp s3://allyvia-prod-frontend s3://allyvia-prod-frontend --recursive --exclude "*" --include "*.css" --metadata-directive REPLACE --content-type "text/css" --cache-control "max-age=31536000,public,immutable"
          aws s3 cp s3://allyvia-prod-frontend s3://allyvia-prod-frontend --recursive --exclude "*" --include "*.woff*" --include "*.ttf" --include "*.png" --include "*.jpg" --include "*.jpeg" --include "*.gif" --include "*.svg" --include "*.ico" --metadata-directive REPLACE --cache-control "max-age=31536000,public,immutable"
          aws s3 cp s3://allyvia-prod-frontend s3://allyvia-prod-frontend --recursive --exclude "*" --include "*.html" --metadata-directive REPLACE --content-type "text/html" --cache-control "max-age=0,no-cache,no-store,must-revalidate"

          echo "S3 deployment completed"

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront cache..."
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query 'DistributionList.Items[?contains(Aliases.Items, `app.allyvia.co`)].Id' --output text)
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "CloudFront distribution not found, skipping invalidation"
            exit 0
          fi
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Invalidation created: $INVALIDATION_ID"

      - name: Deployment summary
        run: |
          echo "## Production Frontend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: https://app.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
