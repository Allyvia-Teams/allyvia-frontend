name: Frontend Production Deployment

on:
  push:
    branches:
      - main
      - develop
      - dev
      - UI-UPDATES-ALLYIA
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  AWS_REGION: 'us-west-2'

jobs:
  test:
    name: Run Tests & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run prettier -- --check .

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: |
          # Run tests if test script exists
          if npm run | grep -q "test"; then
            npm test -- --coverage --watchAll=false --passWithNoTests
          else
            echo "No tests configured, skipping test execution"
          fi

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-production
          path: coverage/
          retention-days: 7

  build:
    name: Build Production Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Create production environment configuration
        run: |
          echo "Creating production environment configuration..."

          cat > .env.production << EOF
          VITE_APP_VERSION=v1.0.0
          GENERATE_SOURCEMAP=false

          # Backend API URL
          VITE_APP_API_URL=https://api.allyvia.co/api/v1
          VITE_APP_BASE_NAME=/

          # QuickBooks Integration
          VITE_APP_QB_CALLBACK_URL=https://app.allyvia.co/quickbooks-callback

          # Environment
          VITE_APP_ENVIRONMENT=production

          # Production optimizations
          VITE_USE_MOCK_API=false
          EOF

          echo "Production environment configuration created:"
          cat .env.production

      - name: Build application
        run: |
          # Build the application
          npm run build

          # Verify build output
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi

          # Check if index.html exists
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: index.html not found in dist"
            exit 1
          fi

          echo "✅ Production build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-production
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-production
          path: ./dist

      - name: Verify build artifacts
        run: |
          echo "📁 Build artifacts downloaded:"
          ls -la ./dist/

          if [ ! -f "./dist/index.html" ]; then
            echo "❌ Missing index.html in build artifacts"
            exit 1
          fi

      - name: Deploy to S3
        run: |
          echo "🚀 Deploying to S3 bucket: allyvia-prod-frontend"

          # Clear existing files first
          aws s3 rm s3://allyvia-prod-frontend --recursive

          # Upload files with proper content-types
          # Upload all files except JS, CSS, and HTML first
          aws s3 sync ./dist s3://allyvia-prod-frontend \
            --exclude "*.html" \
            --exclude "*.js" \
            --exclude "*.css"

          # Upload HTML files with correct content-type
          find ./dist -name "*.html" -type f | while read file; do
            aws s3 cp "$file" "s3://allyvia-prod-frontend/${file#./dist/}" \
              --content-type "text/html"
          done

          # Upload JS files with correct content-type
          find ./dist -name "*.js" -type f | while read file; do
            aws s3 cp "$file" "s3://allyvia-prod-frontend/${file#./dist/}" \
              --content-type "application/javascript"
          done

          # Upload CSS files with correct content-type
          find ./dist -name "*.css" -type f | while read file; do
            aws s3 cp "$file" "s3://allyvia-prod-frontend/${file#./dist/}" \
              --content-type "text/css"
          done

          echo "📝 Setting cache headers for static assets..."

          # Set long cache headers for static assets (JS, CSS, images)
          aws s3 cp s3://allyvia-prod-frontend s3://allyvia-prod-frontend \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --include "*.css" \
            --include "*.woff*" \
            --include "*.ttf" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.ico" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000,public,immutable"

          # Set no-cache headers for HTML files with correct content-type
          aws s3 cp s3://allyvia-prod-frontend s3://allyvia-prod-frontend \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --metadata-directive REPLACE \
            --content-type "text/html" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"

          echo "✅ S3 deployment completed"

      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidating CloudFront cache..."

          # Get CloudFront distribution ID for production
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query 'DistributionList.Items[?contains(Aliases.Items, `app.allyvia.co`)].Id' \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "⚠️ CloudFront distribution for app.allyvia.co not found"
            echo "Please ensure production infrastructure is deployed first"
            exit 1
          fi

          # Create invalidation for all files
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "📋 Invalidation created: $INVALIDATION_ID"
          echo "⏳ Cache invalidation in progress (takes 1-5 minutes)"

      - name: Deployment summary
        run: |
          echo "## 🎉 Production Frontend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: allyvia-prod-frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: https://app.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://app.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: https://api.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **QuickBooks Callback**: https://app.allyvia.co/quickbooks-callback" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Note" >> $GITHUB_STEP_SUMMARY
          echo "- Ensure production infrastructure is deployed via Terraform" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFront cache invalidation takes 1-5 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- Production deployment requires all tests to pass" >> $GITHUB_STEP_SUMMARY