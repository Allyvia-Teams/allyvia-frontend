name: Promote main to prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROMOTE'
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "PROMOTE" ]; then
            echo "Type PROMOTE to confirm."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fast-forward prod to main
        run: git push origin HEAD:prod
