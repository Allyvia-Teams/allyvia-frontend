name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-west-2'
  ENVIRONMENT: 'dev'

jobs:
  # Run comprehensive frontend tests first
  test:
    name: Run Frontend Tests
    uses: ./.github/workflows/frontend-test.yml

  build:
    name: Build Development Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Needed so the BUILD job can read AWS Secrets Manager
      - name: Configure AWS credentials (for build)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ✅ jq is used to parse JSON secrets
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # ✅ Pull Google Maps key from Secrets Manager (prod secret)
      - name: Load Google Maps API key from Secrets Manager
        shell: bash
        run: |
          SECRET_STR=$(aws secretsmanager get-secret-value \
            --secret-id allyvia/prod/frontend/googlemaps \
            --query SecretString \
            --output text)

          # Secret is expected to be JSON:
          # {"VITE_GOOGLE_MAPS_API_KEY":"AIza..."}
          KEY=$(echo "$SECRET_STR" | jq -r '.VITE_GOOGLE_MAPS_API_KEY // empty' 2>/dev/null || true)

          # If it isn't JSON, fall back to raw string
          if [ -z "$KEY" ]; then
            KEY="$SECRET_STR"
          fi

          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "ERROR: Could not load VITE_GOOGLE_MAPS_API_KEY from secret allyvia/prod/frontend/googlemaps"
            echo "SecretString was: $SECRET_STR"
            exit 1
          fi

          echo "VITE_GOOGLE_MAPS_API_KEY=$KEY" >> $GITHUB_ENV
          echo "Loaded key length: ${#KEY}"

      - name: Create development environment configuration
        shell: bash
        run: |
          echo "Creating development environment configuration..."

          cat > .env.production << EOF
          VITE_APP_VERSION=v1.0.0
          GENERATE_SOURCEMAP=false

          # Backend API URL
          VITE_APP_API_URL=https://api.allyvia.co/api/v1
          VITE_APP_BASE_NAME=/

          # QuickBooks Integration
          VITE_APP_QB_CALLBACK_URL=https://app.allyvia.co/quickbooks-callback

          # Environment
          VITE_APP_ENVIRONMENT=dev

          # Google Maps (Places Autocomplete)
          VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}

          # Production optimizations
          VITE_USE_MOCK_API=false
          EOF

          echo "Development environment configuration created (key masked):"
          sed -E 's/(VITE_GOOGLE_MAPS_API_KEY=).+/\1***MASKED***/' .env.production

      - name: Build application
        shell: bash
        run: |
          echo "Building for development environment..."
          NODE_ENV=production npx vite build

          # Verify build output
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: index.html not found in dist"
            exit 1
          fi

          # Verify no localhost references
          if grep -r "localhost:8000" dist/ 2>/dev/null; then
            echo "Warning: Found localhost references in build"
          fi

          echo "Development build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dev
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    environment: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dev
          path: ./dist

      - name: Verify build artifacts
        shell: bash
        run: |
          echo "Build artifacts downloaded:"
          ls -la ./dist/

          if [ ! -f "./dist/index.html" ]; then
            echo "Missing index.html in build artifacts"
            exit 1
          fi

      - name: Deploy to S3
        shell: bash
        run: |
          echo "Deploying to S3 bucket: allyvia-dev-frontend"

          # Clear existing files first
          aws s3 rm s3://allyvia-dev-frontend --recursive

          # Create upload script with correct MIME types
          cat > upload_with_mime.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          for file in $(find ./dist -type f); do
            key=${file#./dist/}
            if [[ "$file" == *.html ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "text/html"
            elif [[ "$file" == *.js ]] || [[ "$file" == *.mjs ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "application/javascript"
            elif [[ "$file" == *.css ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "text/css"
            elif [[ "$file" == *.json ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "application/json"
            elif [[ "$file" == *.svg ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/svg+xml"
            elif [[ "$file" == *.png ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/png"
            elif [[ "$file" == *.jpg ]] || [[ "$file" == *.jpeg ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/jpeg"
            elif [[ "$file" == *.ico ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/x-icon"
            elif [[ "$file" == *.woff ]] || [[ "$file" == *.woff2 ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "font/woff"
            elif [[ "$file" == *.ttf ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "font/ttf"
            else
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key"
            fi
          done
          EOF

          chmod +x upload_with_mime.sh
          ./upload_with_mime.sh

          echo "Setting cache headers for static assets..."

          # Set long cache headers for JavaScript files
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --include "*.mjs" \
            --metadata-directive REPLACE \
            --content-type "application/javascript" \
            --cache-control "max-age=31536000,public,immutable"

          # Set long cache headers for CSS files
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend \
            --recursive \
            --exclude "*" \
            --include "*.css" \
            --metadata-directive REPLACE \
            --content-type "text/css" \
            --cache-control "max-age=31536000,public,immutable"

          # Set long cache headers for static assets (images, fonts)
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend \
            --recursive \
            --exclude "*" \
            --include "*.woff*" \
            --include "*.ttf" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.ico" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000,public,immutable"

          # Set no-cache headers for HTML files
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --metadata-directive REPLACE \
            --content-type "text/html" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"

          echo "S3 deployment completed"

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          echo "Invalidating CloudFront cache..."

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E2SUBFVBSB9DJG \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidation created: $INVALIDATION_ID"
          echo "Cache invalidation in progress (takes 1-5 minutes)"

      - name: Deployment summary
        shell: bash
        run: |
          echo "## Development Frontend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Development" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: allyvia-dev-frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: E2SUBFVBSB9DJG" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: https://app.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://app.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: https://api.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **QuickBooks Callback**: https://app.allyvia.co/quickbooks-callback" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Note" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFront cache invalidation takes 1-5 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- All quality checks passed before deployment"

