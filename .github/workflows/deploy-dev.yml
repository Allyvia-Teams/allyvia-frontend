name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-west-2'
  ENVIRONMENT: 'dev'

jobs:
  test:
    name: Run Frontend Tests
    uses: ./.github/workflows/frontend-test.yml

  build:
    name: Build Development Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔐 AWS creds REQUIRED so build can read Secrets Manager
      - name: Configure AWS credentials (for build)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 🗺️ ONLY load Google Maps key (do NOT touch other env vars)
      - name: Load Google Maps API key from Secrets Manager
        shell: bash
        run: |
          SECRET_STR=$(aws secretsmanager get-secret-value \
            --secret-id allyvia/prod/frontend/googlemaps \
            --query SecretString \
            --output text)

          KEY=$(echo "$SECRET_STR" | jq -r '.VITE_GOOGLE_MAPS_API_KEY')

          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "ERROR: VITE_GOOGLE_MAPS_API_KEY missing in secret allyvia/prod/frontend/googlemaps"
            exit 1
          fi

          # Strip any newline characters just in case
          KEY=$(echo -n "$KEY" | tr -d '\n' | tr -d '\r')

          echo "VITE_GOOGLE_MAPS_API_KEY=$KEY" >> $GITHUB_ENV
          echo "Loaded Google Maps key (length: ${#KEY})"

      # 🧱 Keep ALL existing frontend env vars + append Google Maps
      - name: Create development environment configuration
        shell: bash
        run: |
          echo "Creating development environment configuration..."

          cat > .env.production << EOF
          VITE_APP_VERSION=v1.0.0
          GENERATE_SOURCEMAP=false

          # Backend API URL
          VITE_APP_API_URL=http://api.allyvia.co/api/v1
          VITE_APP_BASE_NAME=/

          # QuickBooks Integration
          VITE_APP_QB_CALLBACK_URL=https://app.allyvia.co/quickbooks-callback

          # Environment
          VITE_APP_ENVIRONMENT=dev
          VITE_USE_MOCK_API=false

          # Google Maps (Places Autocomplete)
          VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
          EOF

          echo ".env.production created (Google key masked):"
          sed -E 's/(VITE_GOOGLE_MAPS_API_KEY=).+/\1***MASKED***/' .env.production

      - name: Build application
        shell: bash
        run: |
          echo "Building frontend..."
          NODE_ENV=production npx vite build

          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: index.html missing"
            exit 1
          fi

          echo "Build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dev
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    environment: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dev
          path: ./dist

      - name: Deploy to S3
        shell: bash
        run: |
          echo "Deploying to S3 bucket: allyvia-dev-frontend"
          aws s3 rm s3://allyvia-dev-frontend --recursive
          aws s3 sync ./dist s3://allyvia-dev-frontend

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2SUBFVBSB9DJG \
            --paths "/*"

      - name: Deployment summary
        shell: bash
        run: |
          echo "## Development Frontend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- App URL: https://app.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- Google Maps autocomplete enabled" >> $GITHUB_STEP_SUMMARY
