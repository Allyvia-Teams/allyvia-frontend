name: Development Frontend Deployment

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || echo "ESLint warnings found, continuing"

      - name: Run Prettier check
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}" || echo "Prettier issues found, continuing"

      - name: Run TypeScript check
        run: npx tsc --noEmit || echo "TypeScript errors found, continuing"

      - name: Run tests
        run: |
          if npm run | grep -q "^ *test"; then
            if node -e "require.resolve('vitest/package.json')" >/dev/null 2>&1; then
              npm run test -- --run --passWithNoTests
            else
              echo "Vitest not installed, skipping tests"
            fi
          else
            echo "No tests configured, skipping tests"
          fi

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage/**') != ''
        with:
          name: coverage-report-dev
          path: coverage/
          retention-days: 7

  build:
    name: Build Development Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dev
          path: dist/
          retention-days: 7
