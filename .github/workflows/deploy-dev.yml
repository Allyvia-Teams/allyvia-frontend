name: Frontend Development Deployment

on:
  push:
    branches:
      - develop
      - dev
      - UI-UPDATES-ALLYIA
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  AWS_REGION: 'us-west-2'

jobs:
  test:
    name: Run Tests & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Run ESLint
        run: npm run lint || echo "ESLint warnings found, continuing with deployment"

      - name: Run Prettier check
        run: npm run prettier -- --check . || echo "Prettier formatting issues found, continuing with deployment"

      - name: Run TypeScript check
        run: npx tsc --noEmit || echo "TypeScript errors found, but continuing with deployment"

      - name: Run tests
        run: |
          # Run tests if test script exists
          if npm run | grep -q "test"; then
            npm test -- --coverage --watchAll=false --passWithNoTests
          else
            echo "No tests configured, skipping test execution"
          fi

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-dev
          path: coverage/
          retention-days: 7

  build:
    name: Build Development Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Create development environment configuration
        run: |
          echo "Creating development environment configuration..."

          cat > .env.production << EOF
          VITE_APP_VERSION=v1.0.0
          GENERATE_SOURCEMAP=false

          # Backend API URL
          VITE_APP_API_URL=https://api.allyvia.co/api/v1
          VITE_APP_BASE_NAME=/

          # QuickBooks Integration
          VITE_APP_QB_CALLBACK_URL=https://app.allyvia.co/quickbooks-callback

          # Environment
          VITE_APP_ENVIRONMENT=dev

          # Production optimizations
          VITE_USE_MOCK_API=false
          EOF

          echo "Development environment configuration created:"
          cat .env.production

      - name: Build application
        run: |
          # Verify environment configuration is loaded
          echo "Verifying environment configuration..."
          cat .env.production

          # Build the application with explicit production mode
          NODE_ENV=production npm run build

          # Verify build output
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi

          # Check if index.html exists
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: index.html not found in dist"
            exit 1
          fi

          # Verify the build contains correct API URL (not localhost)
          echo "Verifying build configuration..."
          if grep -r "localhost:8000" dist/; then
            echo "⚠️ Warning: Found localhost references in build"
          else
            echo "✅ No localhost references found in build"
          fi

          echo "✅ Development build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dev
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    environment: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dev
          path: ./dist

      - name: Verify build artifacts
        run: |
          echo "📁 Build artifacts downloaded:"
          ls -la ./dist/

          if [ ! -f "./dist/index.html" ]; then
            echo "❌ Missing index.html in build artifacts"
            exit 1
          fi

      - name: Deploy to S3
        run: |
          echo "🚀 Deploying to S3 bucket: allyvia-dev-frontend"

          # Clear existing files first
          aws s3 rm s3://allyvia-dev-frontend --recursive

          # Create a simple script to upload files with correct MIME types
          cat > upload_with_mime.sh << 'EOF'
          #!/bin/bash
          for file in $(find ./dist -type f); do
            key=${file#./dist/}
            if [[ "$file" == *.html ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "text/html"
            elif [[ "$file" == *.js ]] || [[ "$file" == *.mjs ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "application/javascript"
            elif [[ "$file" == *.css ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "text/css"
            elif [[ "$file" == *.json ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "application/json"
            elif [[ "$file" == *.svg ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/svg+xml"
            elif [[ "$file" == *.png ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/png"
            elif [[ "$file" == *.jpg ]] || [[ "$file" == *.jpeg ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/jpeg"
            elif [[ "$file" == *.ico ]]; then
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key" --content-type "image/x-icon"
            else
              aws s3 cp "$file" "s3://allyvia-dev-frontend/$key"
            fi
          done
          EOF

          chmod +x upload_with_mime.sh
          ./upload_with_mime.sh

          echo "📝 Setting cache headers for static assets..."

          # Set long cache headers for static assets (JS, CSS, images)
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --include "*.mjs" \
            --include "*.css" \
            --include "*.woff*" \
            --include "*.ttf" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.ico" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000,public,immutable"

          # Set no-cache headers for HTML files with correct content-type
          aws s3 cp s3://allyvia-dev-frontend s3://allyvia-dev-frontend \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --metadata-directive REPLACE \
            --content-type "text/html" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"

          echo "✅ S3 deployment completed"

      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidating CloudFront cache..."

          # Create invalidation for all files
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E2SUBFVBSB9DJG \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "📋 Invalidation created: $INVALIDATION_ID"
          echo "⏳ Cache invalidation in progress (takes 1-5 minutes)"

      - name: Deployment summary
        run: |
          echo "## 🎉 Development Frontend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Development" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: allyvia-dev-frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: E2SUBFVBSB9DJG" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: https://app.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://app.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: https://api.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **QuickBooks Callback**: https://app.allyvia.co/quickbooks-callback" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Note" >> $GITHUB_STEP_SUMMARY
          echo "- DNS setup required for HTTPS access" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFront cache invalidation takes 1-5 minutes" >> $GITHUB_STEP_SUMMARY