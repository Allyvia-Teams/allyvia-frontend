name: Deploy Frontend

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  AWS_REGION: "us-west-2"

jobs:
  test:
    name: Run Frontend Tests
    uses: ./.github/workflows/frontend-test.yml

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (for Secrets Manager)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Decide environment from branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
      
          if [ "$BRANCH" = "main" ]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi
      
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "Using ENVIRONMENT=$ENVIRONMENT (branch=$BRANCH)"

      # Pull ALL frontend-relevant config BEFORE the build
      - name: Load frontend secrets from AWS Secrets Manager
        shell: bash
        run: |
          set -euo pipefail

          # Helper: get SecretString (plaintext secret)
          get_secret () {
            aws secretsmanager get-secret-value \
              --secret-id "$1" \
              --query SecretString \
              --output text
          }

          # ---- Required for Auth / Registration (Auth0) ----
          AUTH0_DOMAIN="$(get_secret "allyvia/${ENVIRONMENT}/auth0-domain")"
          AUTH0_CLIENT_ID="$(get_secret "allyvia/${ENVIRONMENT}/auth0-client-id")"

          # Optional (only include if your frontend uses it)
          # AUTH0_AUDIENCE="$(get_secret "allyvia/${ENVIRONMENT}/auth0-audience")"

          # ---- Your Google Maps secret is JSON (per your workflow) ----
          GMAPS_JSON="$(get_secret "allyvia/prod/frontend/googlemaps")"
          GMAPS_KEY="$(echo "$GMAPS_JSON" | jq -r '.VITE_GOOGLE_MAPS_API_KEY')"
          if [ -z "$GMAPS_KEY" ] || [ "$GMAPS_KEY" = "null" ]; then
            echo "ERROR: VITE_GOOGLE_MAPS_API_KEY missing in allyvia/prod/frontend/googlemaps"
            exit 1
          fi
          GMAPS_KEY="$(echo -n "$GMAPS_KEY" | tr -d '\n' | tr -d '\r')"

          # Export to GitHub env so next step can write .env.production
          echo "VITE_AUTH0_DOMAIN=$AUTH0_DOMAIN" >> $GITHUB_ENV
          echo "VITE_AUTH0_CLIENT_ID=$AUTH0_CLIENT_ID" >> $GITHUB_ENV
          # echo "VITE_AUTH0_AUDIENCE=$AUTH0_AUDIENCE" >> $GITHUB_ENV
          echo "VITE_GOOGLE_MAPS_API_KEY=$GMAPS_KEY" >> $GITHUB_ENV

          echo "Loaded secrets: AUTH0_DOMAIN, AUTH0_CLIENT_ID, GOOGLE_MAPS_KEY"

      - name: Create environment configuration for Vite build
        shell: bash
        run: |
          set -euo pipefail

          # Choose URLs based on environment
          if [ "$ENVIRONMENT" = "prod" ]; then
            API_URL="https://api.allyvia.co/api/v1"
            APP_URL="https://app.allyvia.co"
            QB_CALLBACK_URL="https://app.allyvia.co/quickbooks-callback"
          else
            # TODO: change these to your real dev/staging URLs if different
            API_URL="https://api.allyvia.co/api/v1"
            APP_URL="https://app.allyvia.co"
            QB_CALLBACK_URL="https://app.allyvia.co/quickbooks-callback"
          fi

          cat > .env.production << EOF
          VITE_APP_VERSION=v1.0.0
          GENERATE_SOURCEMAP=false

          VITE_APP_ENVIRONMENT=${ENVIRONMENT}
          VITE_APP_API_URL=${API_URL}
          VITE_APP_BASE_NAME=/

          VITE_APP_QB_CALLBACK_URL=${QB_CALLBACK_URL}

          # Auth0 (Registration/Login)
          VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
          VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
          # VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE}

          # Google Maps (Places Autocomplete)
          VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
          EOF

          echo ".env.production created (sensitive values masked):"
          sed -E \
            -e 's/(VITE_GOOGLE_MAPS_API_KEY=).+/\1***MASKED***/' \
            -e 's/(VITE_AUTH0_CLIENT_ID=).+/\1***MASKED***/' \
            .env.production

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          echo "Building frontend with ENVIRONMENT=$ENVIRONMENT..."
          NODE_ENV=production npx vite build
          test -d dist && test -f dist/index.html
          echo "Build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.ENVIRONMENT }}
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Decide environment from branch
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi
          echo "Using ENVIRONMENT=$ENVIRONMENT (branch=$BRANCH)"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ env.ENVIRONMENT }}
          path: ./dist

      - name: Deploy to S3 + Invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ENVIRONMENT" = "prod" ]; then
            BUCKET="allyvia-prod-frontend"          # TODO: confirm
            DISTRO_ID="PROD_DISTRIBUTION_ID_HERE"   # TODO: fill
            APP_URL="https://app.allyvia.co"
          else
            BUCKET="allyvia-dev-frontend"
            DISTRO_ID="E2SUBFVBSB9DJG"
            APP_URL="https://app.allyvia.co"
          fi

          echo "Deploying to S3 bucket: $BUCKET"
          aws s3 rm "s3://$BUCKET" --recursive
          aws s3 sync ./dist "s3://$BUCKET"

          echo "Invalidating CloudFront: $DISTRO_ID"
          aws cloudfront create-invalidation --distribution-id "$DISTRO_ID" --paths "/*"

          echo "## Frontend Deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "- App URL: $APP_URL" >> $GITHUB_STEP_SUMMARY
