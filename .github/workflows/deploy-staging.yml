name: Deploy to Staging

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-west-2'
  ENVIRONMENT: 'staging'

jobs:
  # Run comprehensive frontend tests first
  test:
    name: Run Frontend Tests
    uses: ./.github/workflows/frontend-test.yml

  build:
    name: Build Staging Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Create staging environment configuration
        run: |
          echo "Creating staging environment configuration..."

          cat > .env.production << EOF
          VITE_APP_VERSION=v1.0.0
          GENERATE_SOURCEMAP=false

          # Backend API URL
          VITE_APP_API_URL=https://api-staging.allyvia.co/api/v1
          VITE_APP_BASE_NAME=/

          # QuickBooks Integration
          VITE_APP_QB_CALLBACK_URL=https://staging.allyvia.co/quickbooks-callback

          # Environment
          VITE_APP_ENVIRONMENT=staging

          # Production optimizations
          VITE_USE_MOCK_API=false
          EOF

          echo "Staging environment configuration created:"
          cat .env.production

      - name: Build application
        run: |
          echo "Building for staging environment..."
          NODE_ENV=production yarn build

          # Verify build output
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: index.html not found in dist"
            exit 1
          fi

          # Verify no localhost references
          if grep -r "localhost:8000" dist/ 2>/dev/null; then
            echo "Warning: Found localhost references in build"
          fi

          echo "Staging build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-staging
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-staging
          path: ./dist

      - name: Verify build artifacts
        run: |
          echo "Build artifacts downloaded:"
          ls -la ./dist/

          if [ ! -f "./dist/index.html" ]; then
            echo "Missing index.html in build artifacts"
            exit 1
          fi

      - name: Deploy to S3
        run: |
          echo "Deploying to S3 bucket: allyvia-staging-frontend"

          # Clear existing files first
          aws s3 rm s3://allyvia-staging-frontend --recursive

          # Create upload script with correct MIME types
          cat > upload_with_mime.sh << 'EOF'
          #!/bin/bash
          for file in $(find ./dist -type f); do
            key=${file#./dist/}
            if [[ "$file" == *.html ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "text/html"
            elif [[ "$file" == *.js ]] || [[ "$file" == *.mjs ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "application/javascript"
            elif [[ "$file" == *.css ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "text/css"
            elif [[ "$file" == *.json ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "application/json"
            elif [[ "$file" == *.svg ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "image/svg+xml"
            elif [[ "$file" == *.png ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "image/png"
            elif [[ "$file" == *.jpg ]] || [[ "$file" == *.jpeg ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "image/jpeg"
            elif [[ "$file" == *.ico ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "image/x-icon"
            elif [[ "$file" == *.woff ]] || [[ "$file" == *.woff2 ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "font/woff"
            elif [[ "$file" == *.ttf ]]; then
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key" --content-type "font/ttf"
            else
              aws s3 cp "$file" "s3://allyvia-staging-frontend/$key"
            fi
          done
          EOF

          chmod +x upload_with_mime.sh
          ./upload_with_mime.sh

          echo "Setting cache headers for static assets..."

          # Set long cache headers for JavaScript files
          aws s3 cp s3://allyvia-staging-frontend s3://allyvia-staging-frontend \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --include "*.mjs" \
            --metadata-directive REPLACE \
            --content-type "application/javascript" \
            --cache-control "max-age=31536000,public,immutable"

          # Set long cache headers for CSS files
          aws s3 cp s3://allyvia-staging-frontend s3://allyvia-staging-frontend \
            --recursive \
            --exclude "*" \
            --include "*.css" \
            --metadata-directive REPLACE \
            --content-type "text/css" \
            --cache-control "max-age=31536000,public,immutable"

          # Set long cache headers for static assets (images, fonts)
          aws s3 cp s3://allyvia-staging-frontend s3://allyvia-staging-frontend \
            --recursive \
            --exclude "*" \
            --include "*.woff*" \
            --include "*.ttf" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.ico" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000,public,immutable"

          # Set no-cache headers for HTML files
          aws s3 cp s3://allyvia-staging-frontend s3://allyvia-staging-frontend \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --metadata-directive REPLACE \
            --content-type "text/html" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"

          echo "S3 deployment completed"

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront cache..."

          # Get CloudFront distribution ID for staging
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query 'DistributionList.Items[?contains(Aliases.Items, `staging.allyvia.co`)].Id' \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "CloudFront distribution for staging.allyvia.co not found"
            echo "Staging infrastructure needs to be deployed first"
            echo "S3 deployment completed successfully without CloudFront invalidation"
            exit 0
          fi

          # Create invalidation for all files
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidation created: $INVALIDATION_ID"
          echo "Cache invalidation in progress (takes 1-5 minutes)"

      - name: Deployment summary
        run: |
          echo "## Staging Frontend Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: allyvia-staging-frontend" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL**: https://staging.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://staging.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: https://api-staging.allyvia.co" >> $GITHUB_STEP_SUMMARY
          echo "- **QuickBooks Callback**: https://staging.allyvia.co/quickbooks-callback" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Note" >> $GITHUB_STEP_SUMMARY
          echo "- Ensure staging infrastructure is deployed via Terraform" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFront cache invalidation takes 1-5 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- All quality checks passed before deployment" >> $GITHUB_STEP_SUMMARY
