version: '3.8'

services:
  web:
    build: ./app
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENVIRONMENT=dev
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1
      # Database configuration
      - USE_POSTGRES=True
      - DB_NAME=allyvia_db
      - DB_USER=allyvia
      - DB_PASSWORD=allyvia_pass
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: always

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=allyvia
      - POSTGRES_PASSWORD=allyvia_pass
      - POSTGRES_DB=allyvia_db
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data:
